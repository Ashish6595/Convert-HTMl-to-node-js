<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Express Starter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">Express Starter</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
            <div class="collapse navbar-collapse" id="mainNav"><ul class="navbar-nav ms-auto"><li class="nav-item"><a class="nav-link" href="/">Home</a></li><li class="nav-item"><a class="nav-link" href="/about">About</a></li><li class="nav-item"><a class="nav-link active" aria-current="page" href="/contect">Contact</a></li></ul></div>
        </div>
    </nav>
    <main class="container py-5">
        <div class="row justify-content-center"><div class="col-lg-7">
            <div class="text-center mb-4"><span class="badge text-bg-primary mb-3">Contact</span><h1 class="fw-bold">Let's talk</h1><p class="text-secondary">Have a question or an idea? Send us a message.</p></div>
            <div class="card border-0 shadow-sm"><div class="card-body p-4 p-md-5"><form><div class="mb-3"><label class="form-label" for="name">Name</label><input class="form-control" id="name" name="name" type="text" placeholder="Your name" required></div><div class="mb-3"><label class="form-label" for="email">Email address</label><input class="form-control" id="email" name="email" type="email" placeholder="name@example.com" required></div><div class="mb-4"><label class="form-label" for="message">Message</label><textarea class="form-control" id="message" name="message" rows="5" placeholder="How can we help?" required></textarea></div><button class="btn btn-primary" type="submit">Send message</button></form></div></div>
        </div></div>
    </main>
    <footer class="border-top bg-white py-4"><div class="container text-center text-secondary">&copy; 2026 Express Starter</div></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
